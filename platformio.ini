[env:esp32-s3-touch-lcd-28b]
board = esp32-s3-devkitc-1
framework = arduino
;platform = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug

board_build.arduino.memory_type = qio_opi ; Crucial for N16R8 PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; LV_COLOR_16_SWAP is NOT set – RGB LCD does not need byte-swapped RGB565
    ; Board define for ESP32_Display_Panel predefined board support.
    -DESP_PANEL_BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_2_8_B
    -I .
    -I src
    -I src/screen

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    z3t0/IRremote@^4.4.1

